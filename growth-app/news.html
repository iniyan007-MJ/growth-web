<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>AI & IT News — Daily Growth</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div class="bg-mesh"><div class="mesh-orb mo1"></div><div class="mesh-orb mo2"></div><div class="mesh-orb mo3"></div></div>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sb-logo">
      <div class="sb-logo-icon">🚀</div>
      <span class="sb-logo-text">Daily Growth</span>
    </div>
    <nav class="sb-nav">
      <a href="dashboard.html" class="sb-link"><span class="sb-link-icon">📋</span><span class="sb-link-label">Dashboard</span></a>
      <a href="weekly.html"    class="sb-link"><span class="sb-link-icon">📊</span><span class="sb-link-label">Weekly Review</span></a>
      <a href="news.html"      class="sb-link active"><span class="sb-link-icon">🌐</span><span class="sb-link-label">AI &amp; IT News</span></a>
    </nav>
    <div class="sb-section-label">Theme</div>
    <div class="sb-themes">
      <button class="sb-theme-btn" onclick="applyTheme('girls')"><span class="td-dot girls"></span>Girls 🌸</button>
      <button class="sb-theme-btn" onclick="applyTheme('purple')"><span class="td-dot purple"></span>Purple</button>
      <button class="sb-theme-btn" onclick="applyTheme('navy')"><span class="td-dot navy"></span>Navy</button>
      <button class="sb-theme-btn" onclick="applyTheme('teal')"><span class="td-dot teal"></span>Teal</button>
    </div>
    <div class="sb-bottom">
      <button class="sb-logout" onclick="window.location='dashboard.html'">← Back to Dashboard</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="main-topbar">
      <div class="topbar-left">
        <button class="sb-toggle" onclick="toggleSidebar()">☰</button>
        <div>
          <h2 class="page-title">🌐 AI &amp; IT News</h2>
          <p class="page-sub" id="news-status">Checking cache...</p>
        </div>
      </div>
      <div class="topbar-right">
        <div class="api-counter-badge api-ok" id="api-badge"><span class="api-dot"></span><span id="api-label">API: 0/20</span></div>
        <button class="dark-toggle-btn" id="dark-toggle" onclick="toggleDark()">🌙</button>
        <button class="btn-save" id="refresh-btn" onclick="forceRefresh()">🔄 Refresh</button>
      </div>
    </header>

    <div class="news-page-body">
      <div class="news-page-tabs">
        <button class="news-page-tab active" id="ntab-ai" onclick="showTab('ai')">🤖 AI World</button>
        <button class="news-page-tab"        id="ntab-it" onclick="showTab('it')">💻 IT World</button>
      </div>
      <div id="tab-ai"><div class="news-grid" id="grid-ai"><div class="news-page-loading">Loading...</div></div></div>
      <div id="tab-it" style="display:none;"><div class="news-grid" id="grid-it"><div class="news-page-loading">Loading...</div></div></div>
      <p class="news-cache-note" id="cache-note"></p>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
// News page — uses auth.js for addApiCall/updateApiUI
const NK = 'dg_news_data', ND = 'dg_news_day';

function showTab(t) {
  document.getElementById('tab-ai').style.display = t==='ai' ? 'block' : 'none';
  document.getElementById('tab-it').style.display = t==='it' ? 'block' : 'none';
  document.getElementById('ntab-ai').classList.toggle('active', t==='ai');
  document.getElementById('ntab-it').classList.toggle('active', t==='it');
}

function renderGrid(id, items, tagClass, tagText) {
  const el = document.getElementById(id);
  if (!el) return;
  if (!items || !items.length) { el.innerHTML='<p class="news-page-loading">No news found.</p>'; return; }
  el.innerHTML = items.map((n,i) => `
    <div class="news-full-card" style="animation-delay:${i*0.07}s">
      <span class="news-tag ${tagClass}">${tagText}</span>
      <h3 class="nfc-title">${n.title}</h3>
      <p class="nfc-summary">${n.summary||''}</p>
      <div class="nfc-footer">
        <span class="nfc-time">🕐 ${n.time}</span>
        <span class="nfc-cat">${n.category||''}</span>
      </div>
    </div>`).join('');
}

function renderAll(parsed) {
  renderGrid('grid-ai', parsed.ai_news, 'ai', '🤖 AI');
  renderGrid('grid-it', parsed.it_news, 'it', '💻 IT');
}

async function loadNews(force) {
  updateApiUI();
  const today = new Date().toISOString().slice(0,10);
  const cached = localStorage.getItem(NK);
  const cachedDay = localStorage.getItem(ND);

  if (!force && cachedDay === today && cached) {
    renderAll(JSON.parse(cached));
    document.getElementById('news-status').textContent = 'Cached — refreshes tomorrow automatically';
    document.getElementById('cache-note').textContent = '📦 Using today\'s cached news. Click Refresh to force update.';
    return;
  }

  document.getElementById('grid-ai').innerHTML = '<div class="news-page-loading">⏳ Fetching AI news from Gemini...</div>';
  document.getElementById('grid-it').innerHTML = '<div class="news-page-loading">⏳ Fetching IT news from Gemini...</div>';
  document.getElementById('news-status').textContent = 'Fetching fresh news...';

  try {
    addApiCall(); // from auth.js
    const prompt = 'Give 6 AI world news headlines and 6 IT world tech news headlines from 2025. Be specific with real recent events. Return ONLY valid JSON with no markdown fences. Schema: {"ai_news":[{"title":"string","summary":"string","time":"string","category":"string"}],"it_news":[{"title":"string","summary":"string","time":"string","category":"string"}]}';

    const res = await fetch(
      'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + APP_CONFIG.ai.apiKey,
      { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ contents:[{ parts:[{ text: prompt }] }] }) }
    );
    const json = await res.json();
    if (!res.ok) throw new Error(json?.error?.message || 'API error ' + res.status);
    const raw = json?.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!raw) throw new Error('Empty response from Gemini');
    // Strip any accidental markdown fences
    const clean = raw.replace(/^```[a-z]*\n?/,'').replace(/\n?```$/,'').trim();
    const parsed = JSON.parse(clean);
    localStorage.setItem(NK, JSON.stringify(parsed));
    localStorage.setItem(ND, today);
    renderAll(parsed);
    document.getElementById('news-status').textContent = 'Fresh news — ' + new Date().toLocaleTimeString();
    document.getElementById('cache-note').textContent = '✅ News cached for today!';
    updateApiUI();
  } catch(e) {
    document.getElementById('grid-ai').innerHTML = '<div class="news-page-loading" style="color:var(--red);">⚠️ ' + e.message + '</div>';
    document.getElementById('grid-it').innerHTML = '<div class="news-page-loading" style="color:var(--red);">⚠️ ' + e.message + '</div>';
    document.getElementById('news-status').textContent = 'Failed: ' + e.message;
    console.error('News fetch error:', e);
  }
}

function forceRefresh() {
  const count = getApiCount();
  if (count >= 20) { showToast('Daily API limit reached! 📵'); return; }
  loadNews(true);
}

window.addEventListener('DOMContentLoaded', () => {
  // initAppTheme is called by auth.js DOMContentLoaded
  loadNews(false);
});
</script>
</body>
</html>
